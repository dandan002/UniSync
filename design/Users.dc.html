<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>People</title>
<script src="./support.js"></script>
<script src="/_blob/5a4da31561d74fe775b9d84423f4c9e4"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0;background:#FFFFFF}
a{color:#4A55A8}a:hover{color:#36408A}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 16px;border-radius:8px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:500;font-size:14px;text-decoration:none;border:1px solid #DCDEEE;background:#FFFFFF;color:#1E2140;cursor:pointer;transition:border-color .2s;white-space:nowrap}
.btn:hover{border-color:#C3C7E0;color:#1E2140}
.btn-p{background:#D4DAFF;color:#1E2140;border-color:#D4DAFF}.btn-p:hover{background:#B8C1FA;color:#1E2140}
.side a{display:flex;align-items:center;gap:8px;height:42px;padding:0 12px;border-radius:12px;color:#5E6280;text-decoration:none;font-size:15px;font-weight:500;transition:background .2s,color .2s}
.side a:hover{background:#EEF0FA;color:#1E2140}
.tabu{height:48px;padding:0;border:0;background:transparent;font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;font-weight:500;cursor:pointer;transition:color .2s}
th{font-weight:500;text-align:left;color:#5E6280;font-size:13px;padding:0 16px;height:44px;border-bottom:1px solid #E6E7F2;white-space:nowrap}
td{padding:0 16px;height:68px;border-bottom:1px solid #EEF0FA;font-size:15px;white-space:nowrap}
select{height:40px;border-radius:12px;border:1px solid #DCDEEE;background:#FFFFFF;color:#1E2140;font:inherit;font-size:14px;font-weight:500;padding:0 12px}
.in{animation:rise .4s cubic-bezier(.22,1,.36,1) both}
.pop{animation:pop .45s cubic-bezier(.34,1.45,.5,1) both}
.fade{animation:fade .3s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translate(-50%,-46%) scale(.94)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div ref="{{rootRef}}" style="font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;background:#FFFFFF;color:#1E2140;min-height:100vh;display:flex;flex-wrap:wrap;position:relative">

<nav class="side" aria-label="Console" data-in="1" style="flex:1 1 240px;max-width:260px;background:#FAFAFE;border-right:1px solid #E6E7F2;padding:20px 12px;display:flex;flex-direction:column;gap:4px;box-sizing:border-box">
<a href="Main.dc.html" aria-label="Unisync home" style="height:auto;padding:0 12px 20px;font-weight:600;letter-spacing:-0.01em;font-size:18px;color:#1E2140;background:transparent"><svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><g fill="#1E2140"><rect x="14.5" y="1" width="3" height="7" rx="1.5"/><rect x="14.5" y="1" width="3" height="7" rx="1.5" transform="rotate(45 16 16)"/><rect x="14.5" y="1" width="3" height="7" rx="1.5" transform="rotate(90 16 16)"/><rect x="14.5" y="1" width="3" height="7" rx="1.5" transform="rotate(135 16 16)"/><rect x="14.5" y="1" width="3" height="7" rx="1.5" transform="rotate(180 16 16)"/><rect x="14.5" y="1" width="3" height="7" rx="1.5" transform="rotate(225 16 16)"/><rect x="14.5" y="1" width="3" height="7" rx="1.5" transform="rotate(270 16 16)"/><rect x="14.5" y="1" width="3" height="7" rx="1.5" transform="rotate(315 16 16)"/></g><circle cx="16" cy="16" r="5" fill="#A99BF0"/></svg>unisync</a>
<a href="Coordinator.dc.html">Students</a>
<a href="#companies">Companies</a>
<a href="#forms">Forms</a>
<a href="#reports">CHED reports</a>
<a href="Users.dc.html" aria-current="page" style="background:#FFFFFF;color:#1E2140;box-shadow:0 0 0 1px #E6E7F2">People</a>
</nav>

<main style="flex:999 1 640px;min-width:0;padding:40px 40px 64px;display:flex;flex-direction:column;gap:24px;box-sizing:border-box">
<div data-in="1" style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px">
<div style="display:flex;flex-direction:column;gap:4px"><span style="font-size:15px;font-weight:500;color:#5E6280">Bayview State University</span><h1 style="font-family:'Newsreader',Georgia,serif;margin:0;font-size:clamp(30px,3.4vw,40px);font-weight:400;letter-spacing:-0.015em">People</h1></div>
<div style="display:flex;gap:8px"><button class="btn" data-press="1">Upload class list</button><button class="btn btn-p" data-press="1" onClick="{{openInvite}}">Invite</button></div>
</div>

<div data-in="1" role="tablist" aria-label="Sections" style="position:relative;display:flex;gap:32px;border-bottom:1px solid #E6E7F2">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4"><button class="tabu" role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="color:{{t.color}}">{{t.label}}</button></sc-for>
<span aria-hidden="true" style="position:absolute;bottom:-1px;left:0;height:3px;border-radius:2px;background:#7C88DC;transition:transform .45s cubic-bezier(.34,1.3,.5,1),width .45s cubic-bezier(.34,1.3,.5,1);width:{{ulW}}px;transform:translateX({{ulX}}px)"></span>
</div>

<sc-if value="{{isPeople}}" hint-placeholder-val="{{true}}">
<section class="in" aria-label="People list" style="border:1px solid #E6E7F2;border-radius:12px;overflow-x:auto">
<table style="width:100%;border-collapse:collapse;min-width:820px">
<thead><tr><th>Name</th><th>Role</th><th>Handles</th><th>Status</th><th>Last seen</th><th><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Actions</span></th></tr></thead>
<tbody>
<sc-for list="{{people}}" as="p" hint-placeholder-count="6">
<tr>
<td><span style="display:flex;align-items:center;gap:12px"><span style="width:38px;height:38px;border-radius:50%;background:{{p.avBg}};color:{{p.avFg}};display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500">{{p.ini}}</span><span style="display:flex;flex-direction:column;gap:2px"><span style="font-weight:500">{{p.name}}</span><span style="font-size:13px;color:#5E6280">{{p.email}}</span></span></span></td>
<td><label><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Role for {{p.name}}</span><select value="{{p.role}}" onChange="{{p.setRole}}"><option>Student</option><option>Coordinator</option><option>Supervisor</option><option>Admin</option></select></label></td>
<td style="color:#3F4262">{{p.scope}}</td>
<td style="color:{{p.statusColor}};font-weight:500">{{p.status}}</td>
<td style="color:#5E6280">{{p.last}}</td>
<td><button aria-label="More for {{p.name}}" style="width:40px;height:40px;border-radius:50%;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="#5E6280" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button></td>
</tr>
</sc-for>
</tbody>
</table>
</section>
</sc-if>

<sc-if value="{{isRoles}}" hint-placeholder-val="{{false}}">
<section class="in" aria-label="What each role can do" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:12px">
<sc-for list="{{roles}}" as="r" hint-placeholder-count="4">
<div style="border:1px solid #E6E7F2;border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:12px">
<span style="font-size:18px;font-weight:600;letter-spacing:-0.005em">{{r.name}}</span>
<ul style="margin:0;padding-left:16px;display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.45;color:#3F4262"><sc-for list="{{r.can}}" as="c" hint-placeholder-count="3"><li>{{c}}</li></sc-for></ul>
</div>
</sc-for>
</section>
</sc-if>

<sc-if value="{{isVerify}}" hint-placeholder-val="{{false}}">
<section class="in" aria-label="Company checks" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:12px">
<sc-for list="{{companies}}" as="c" hint-placeholder-count="3">
<div style="border:1px solid {{c.border}};border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:16px;transition:border-color .4s,background .4s;background:{{c.bg}}">
<div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:18px;font-weight:600">{{c.name}}</span><span style="font-size:14px;font-weight:500;color:{{c.stateColor}}">{{c.state}}</span></div>
<div style="display:flex;flex-direction:column;gap:8px;font-size:15px"><sc-for list="{{c.checks}}" as="k" hint-placeholder-count="3"><span style="display:flex;justify-content:space-between"><span style="color:#5E6280">{{k.n}}</span><span style="font-weight:500;color:{{k.color}}">{{k.v}}</span></span></sc-for></div>
<sc-if value="{{c.pending}}" hint-placeholder-val="{{true}}"><div style="display:flex;gap:8px"><button class="btn btn-p" onClick="{{c.approve}}">Approve</button><button class="btn">Ask for more</button></div></sc-if>
</div>
</sc-for>
</section>
</sc-if>

<sc-if value="{{isAudit}}" hint-placeholder-val="{{false}}">
<section class="in" aria-label="Activity" style="border:1px solid #E6E7F2;border-radius:12px">
<sc-for list="{{audit}}" as="a" hint-placeholder-count="5">
<div style="display:flex;flex-wrap:wrap;gap:4px 20px;align-items:baseline;padding:16px 20px;border-bottom:1px solid #EEF0FA;font-size:15px"><span style="color:#5E6280;width:110px;flex:none">{{a.t}}</span><span><span style="font-weight:500">{{a.who}}</span> {{a.what}}</span></div>
</sc-for>
</section>
</sc-if>
</main>

<sc-if value="{{invite}}" hint-placeholder-val="{{false}}">
<button class="fade" aria-label="Close invite" onClick="{{closeInvite}}" style="position:fixed;inset:0;width:100%;height:100%;border:0;padding:0;cursor:default;background:rgba(30,33,64,.35);backdrop-filter:blur(3px)"></button>
<div class="pop" role="dialog" aria-modal="true" aria-labelledby="inv-h" style="position:fixed;left:50%;top:50%;width:min(460px,calc(100% - 32px));box-sizing:border-box;background:#FFFFFF;border-radius:12px;padding:32px;display:flex;flex-direction:column;gap:16px;box-shadow:0 1px 2px rgba(30,33,64,.04),0 8px 24px -12px rgba(30,33,64,.12)">
<h2 id="inv-h" style="font-family:'Newsreader',Georgia,serif;margin:0;font-size:24px;font-weight:400;letter-spacing:-0.015em">Invite people</h2>
<label style="display:flex;flex-direction:column;gap:8px;font-size:14px;font-weight:500">Emails<input type="text" placeholder="name@bsu.edu.ph" style="height:48px;border-radius:10px;border:1px solid #DCDEEE;padding:0 16px;font:inherit;font-size:15px;font-weight:500"></label>
<label style="display:flex;flex-direction:column;gap:8px;font-size:14px;font-weight:500">Role<select style="height:48px;border-radius:10px"><option>Coordinator</option><option>Supervisor</option><option>Admin</option></select></label>
<div style="display:flex;justify-content:flex-end;gap:8px;padding-top:4px"><button class="btn" onClick="{{closeInvite}}">Cancel</button><button class="btn btn-p" onClick="{{closeInvite}}">Send</button></div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.root = null; this.tabEls = [];
    this.state = { tab: 0, invite: false, approved: [], ul: [70, 0],
      people: [
        { name: 'Maria Reyes', email: 'mreyes@bsu.edu.ph', role: 'Coordinator', scope: 'BSIT, BSCS', status: 'Active', last: 'Now' },
        { name: 'Ramon Cruz', email: 'rcruz@bsu.edu.ph', role: 'Admin', scope: 'All programs', status: 'Active', last: '2 hours ago' },
        { name: 'Liza Ocampo', email: 'liza@kalyelogistics.ph', role: 'Supervisor', scope: 'Kalye Logistics', status: 'Active', last: 'Yesterday' },
        { name: 'Jun Mercado', email: 'jmercado@bsu.edu.ph', role: 'Coordinator', scope: 'BSBA', status: 'Invited', last: '—' },
        { name: 'Bea Santos', email: 'bsantos@bsu.edu.ph', role: 'Student', scope: 'BSIT 4', status: 'Active', last: '2 hours ago' },
        { name: 'Ryan Go', email: 'ryan@mabuhayfoods.ph', role: 'Supervisor', scope: 'Mabuhay Foods', status: 'Paused', last: 'A month ago' }
      ] };
  }
  componentDidMount() {
    this.measure();
    const M = window.Motion, r = this.root;
    if (!M || !r || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
    const { animate, stagger, press } = M;
    animate(r.querySelectorAll('[data-in]'), { opacity: [0, 1], y: [18, 0] }, { delay: stagger(0.07), duration: 0.8, ease: [0.22, 1, 0.36, 1] });
    animate(r.querySelectorAll('tbody tr'), { opacity: [0, 1], y: [10, 0] }, { delay: stagger(0.05, { startDelay: 0.3 }), duration: 0.5 });
    r.querySelectorAll('[data-press]').forEach((el) => press(el, () => {
      animate(el, { scale: 0.95 }, { type: 'spring', stiffness: 700, damping: 30 });
      return () => animate(el, { scale: 1 }, { type: 'spring', stiffness: 500, damping: 15 });
    }));
  }
  componentDidUpdate(pp, ps) { if (ps.tab !== this.state.tab) this.measure(); }
  measure() {
    const r = this.root; if (!r) return;
    const tabs = r.querySelectorAll('.tabu'), t = tabs[this.state.tab];
    if (!t) return;
    const w = t.offsetWidth, x = t.offsetLeft - tabs[0].offsetLeft;
    if (w !== this.state.ul.at(0) || x !== this.state.ul.at(1)) this.setState({ ul: [w, x] });
  }
  renderVals() {
    const s = this.state;
    const labels = ['People', 'Roles', 'Company checks', 'Activity'];
    const statusColor = { Active: '#4A55A8', Invited: '#4A55A8', Paused: '#6A5DC2' };
    const av = { Student: ['#E8EBFF', '#4A55A8'], Coordinator: ['#F1EDFF', '#6A5DC2'], Supervisor: ['#E8EBFF', '#4A55A8'], Admin: ['#F1EDFF', '#6A5DC2'] };
    const companies = [
      { id: 'pulo', name: 'Pulo Telecom', checks: [['SEC record', 'Matches', '#4A55A8'], ['Work email', 'Confirmed', '#4A55A8'], ['Phone check', 'Not yet', '#6A5DC2']] },
      { id: 'halo', name: 'Halo-Halo Labs', checks: [['DTI record', 'Matches', '#4A55A8'], ['Work email', 'Uses Gmail', '#6A5DC2'], ['Phone check', 'Done', '#4A55A8']] },
      { id: 'kalye', name: 'Kalye Logistics', done: true, checks: [['SEC record', 'Matches', '#4A55A8'], ['Work email', 'Confirmed', '#4A55A8'], ['Phone check', 'Done', '#4A55A8']] }
    ].map((c) => { const ok = c.done || s.approved.indexOf(c.id) > -1;
      return { name: c.name, pending: !ok, state: ok ? 'Verified' : 'Needs review', stateColor: ok ? '#4A55A8' : '#6A5DC2', border: ok ? '#DCDEEE' : '#E6E7F2', bg: ok ? '#F7F8FD' : '#FFFFFF',
        checks: c.checks.map((k) => ({ n: k.at(0), v: k.at(1), color: k.at(2) })), approve: () => this.setState({ approved: s.approved.concat([c.id]) }) }; });
    return {
      rootRef: (el) => { this.root = el; },
      tabs: labels.map((l, i) => ({ label: l, on: s.tab === i, color: s.tab === i ? '#1E2140' : '#5E6280', pick: () => this.setState({ tab: i }) })),
      ulW: s.ul.at(0), ulX: s.ul.at(1),
      isPeople: s.tab === 0, isRoles: s.tab === 1, isVerify: s.tab === 2, isAudit: s.tab === 3,
      people: s.people.map((p, i) => ({ ...p, ini: p.name.split(' ').map((w) => w.charAt(0)).join(''),
        avBg: av[p.role].at(0), avFg: av[p.role].at(1), statusColor: statusColor[p.status],
        setRole: (e) => { const next = s.people.slice(); next.splice(i, 1, { ...p, role: e.target.value }); this.setState({ people: next }); } })),
      roles: [
        { name: 'Student', can: ['Build and edit their resume', 'Apply to verified companies', 'Sign their own forms'] },
        { name: 'Coordinator', can: ['See their programs’ students', 'Approve placements', 'Export CHED reports'] },
        { name: 'Supervisor', can: ['Approve intern hours', 'Send evaluations', 'Sign MOAs for their company'] },
        { name: 'Admin', can: ['Everything coordinators can', 'Manage people and roles', 'Approve companies'] }
      ],
      companies,
      audit: [
        { t: 'Today, 9:12', who: 'Maria Reyes', what: 'placed Paolo Dizon at Kalye Logistics' },
        { t: 'Today, 8:40', who: 'Ramon Cruz', what: 'made Jun Mercado a coordinator' },
        { t: 'Yesterday', who: 'Unisync', what: 'blocked a message from Halo-Halo Labs asking for a deposit' },
        { t: 'Yesterday', who: 'Liza Ocampo', what: 'approved 4 weeks of hours' },
        { t: 'Mar 1', who: 'Maria Reyes', what: 'exported the CHED report' }
      ],
      invite: s.invite, openInvite: () => this.setState({ invite: true }), closeInvite: () => this.setState({ invite: false })
    };
  }
}
</script>
</body>
</html>
