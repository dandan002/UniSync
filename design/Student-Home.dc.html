<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home</title>
<script src="./support.js"></script>
<script src="/_blob/5a4da31561d74fe775b9d84423f4c9e4"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0;background:#FFFFFF}
a{color:#2F5BEA}a:hover{color:#1E40AF}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;border-radius:999px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:15px;text-decoration:none;border:1px solid #E4E2DD;background:#FFFFFF;color:#16161A;cursor:pointer;transition:border-color .2s}
.btn:hover{border-color:#C9C6BF;color:#16161A}
.tab{color:#5E5E66;text-decoration:none;font-size:15px;font-weight:600;height:72px;display:flex;align-items:center;border-bottom:2px solid transparent}
.tab:hover{color:#16161A}
.app{width:100%;display:flex;align-items:center;gap:16px;padding:18px 20px;background:#FFFFFF;border:0;border-top:1px solid #ECEBE8;color:#16161A;font-family:'Plus Jakarta Sans',sans-serif;text-align:left;cursor:pointer;transition:background .2s}
.app:hover{background:#FBFAF8}
.logo{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex:none}
.note{position:absolute;left:0;right:0;border:1px solid #ECEBE8;background:#FFFFFF;border-radius:18px;padding:16px 18px;display:flex;gap:14px;align-items:center;transition:transform .55s cubic-bezier(.34,1.3,.5,1),opacity .4s;box-sizing:border-box;box-shadow:0 10px 30px -20px rgba(22,22,26,.3)}
.in{animation:rise .45s cubic-bezier(.22,1,.36,1) both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div ref="{{rootRef}}" style="font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;background:#FFFFFF;color:#16161A;min-height:100vh">

<header style="border-bottom:1px solid #ECEBE8">
<div style="max-width:1240px;margin:0 auto;padding:0 28px;display:flex;flex-wrap:wrap;align-items:center;gap:0 32px">
<a href="Main.dc.html" aria-label="Unisync home" style="display:flex;align-items:center;gap:9px;text-decoration:none;color:#16161A;height:72px;font-weight:800;letter-spacing:-0.04em;font-size:19px"><svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><g fill="#16161A"><rect x="14.5" y="1" width="3" height="7" rx="1.5"/><rect x="14.5" y="1" width="3" height="7" rx="1.5" transform="rotate(45 16 16)"/><rect x="14.5" y="1" width="3" height="7" rx="1.5" transform="rotate(90 16 16)"/><rect x="14.5" y="1" width="3" height="7" rx="1.5" transform="rotate(135 16 16)"/><rect x="14.5" y="1" width="3" height="7" rx="1.5" transform="rotate(180 16 16)"/><rect x="14.5" y="1" width="3" height="7" rx="1.5" transform="rotate(225 16 16)"/><rect x="14.5" y="1" width="3" height="7" rx="1.5" transform="rotate(270 16 16)"/><rect x="14.5" y="1" width="3" height="7" rx="1.5" transform="rotate(315 16 16)"/></g><circle cx="16" cy="16" r="5" fill="#FFB020"/></svg>unisync</a>
<nav aria-label="Student" style="display:flex;gap:28px;flex:1">
<a class="tab" href="Student-Home.dc.html" aria-current="page" style="color:#16161A;border-bottom-color:#2F5BEA">Home</a>
<a class="tab" href="Student-Jobs.dc.html">Jobs</a>
<a class="tab" href="Student-Ready.dc.html">Resume</a>
</nav>
<span style="width:38px;height:38px;border-radius:50%;background:#EEF2FE;color:#2F5BEA;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700" aria-label="Bea Santos">BS</span>
</div>
</header>

<div style="max-width:1240px;margin:0 auto;padding:36px 28px 72px;display:flex;flex-direction:column;gap:28px">
<h1 data-in="1" style="margin:0;font-size:clamp(32px,4vw,44px);font-weight:800;letter-spacing:-0.045em">Hi, Bea.</h1>

<section data-in="1" aria-label="Next up" style="position:relative;overflow:hidden;border-radius:28px;background:#2F5BEA;color:#FFFFFF;padding:36px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:24px 40px">
<svg width="360" height="360" viewBox="0 0 32 32" aria-hidden="true" class="spin" style="position:absolute;right:-90px;top:-110px;opacity:.12"><g fill="#FFFFFF"><rect x="14.5" y="1" width="3" height="7" rx="1.5"/><rect x="14.5" y="1" width="3" height="7" rx="1.5" transform="rotate(45 16 16)"/><rect x="14.5" y="1" width="3" height="7" rx="1.5" transform="rotate(90 16 16)"/><rect x="14.5" y="1" width="3" height="7" rx="1.5" transform="rotate(135 16 16)"/><rect x="14.5" y="1" width="3" height="7" rx="1.5" transform="rotate(180 16 16)"/><rect x="14.5" y="1" width="3" height="7" rx="1.5" transform="rotate(225 16 16)"/><rect x="14.5" y="1" width="3" height="7" rx="1.5" transform="rotate(270 16 16)"/><rect x="14.5" y="1" width="3" height="7" rx="1.5" transform="rotate(315 16 16)"/><circle cx="16" cy="16" r="5"/></g></svg>
<div style="flex:1 1 380px;display:flex;flex-direction:column;gap:10px;position:relative">
<span style="font-size:15px;font-weight:600;color:#DCE4FD">Next up · in 2 days</span>
<span style="font-size:clamp(30px,3.6vw,44px);font-weight:800;letter-spacing:-0.045em;line-height:1.05">Interview with Kalye Logistics</span>
<span style="font-size:17px;color:#DCE4FD">Thursday, 2:00 PM · Google Meet</span>
</div>
<div style="display:flex;gap:10px;position:relative;flex-wrap:wrap">
<a href="#prep" class="btn" data-press="1" style="border-color:#FFFFFF">Practice with Sync</a>
<a href="#cal" class="btn" data-press="1" style="background:transparent;color:#FFFFFF;border-color:rgba(255,255,255,.5)">Add to calendar</a>
</div>
</section>

<div style="display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start">
<section data-in="1" aria-labelledby="apps-h" style="flex:999 1 560px;min-width:0;border:1px solid #ECEBE8;border-radius:24px;overflow:hidden">
<div style="display:flex;justify-content:space-between;align-items:baseline;padding:22px 20px 16px"><h2 id="apps-h" style="margin:0;font-size:20px;font-weight:800;letter-spacing:-0.02em">Applications</h2><a href="Student-Jobs.dc.html" style="font-size:15px;font-weight:600">Find more</a></div>
<sc-for list="{{apps}}" as="a" hint-placeholder-count="4">
<div>
<button class="app" aria-expanded="{{a.open}}" onClick="{{a.toggle}}">
<span class="logo" style="background:{{a.bg}}">
<sc-if value="{{a.isKalye}}" hint-placeholder-val="{{true}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E07B00" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 18l5-6-5-6M12 18l5-6-5-6"/></svg></sc-if>
<sc-if value="{{a.isMabuhay}}" hint-placeholder-val="{{false}}"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19C5 10 11 5 20 4c-1 9-6 15-15 15z" fill="#1A7F45"/><path d="M5 19l8-8" stroke="#E9F6EE" stroke-width="1.8" stroke-linecap="round"/></svg></sc-if>
<sc-if value="{{a.isBanaba}}" hint-placeholder-val="{{false}}"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><g fill="#7C3AED"><circle cx="12" cy="6.5" r="4.5"/><circle cx="17.5" cy="12" r="4.5"/><circle cx="12" cy="17.5" r="4.5"/><circle cx="6.5" cy="12" r="4.5"/></g><circle cx="12" cy="12" r="2.6" fill="#F3EEFE"/></svg></sc-if>
<sc-if value="{{a.isTanglaw}}" hint-placeholder-val="{{false}}"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l3 6 6 3-6 3-3 6-3-6-6-3 6-3z" fill="#2F5BEA"/></svg></sc-if>
</span>
<span style="flex:1;display:flex;flex-direction:column;gap:3px"><span style="font-weight:700;font-size:16px">{{a.role}}</span><span style="font-size:14px;color:#5E5E66">{{a.co}}</span></span>
<span style="font-size:15px;font-weight:600;text-align:right;color:{{a.color}}">{{a.status}}</span>
</button>
<sc-if value="{{a.open}}" hint-placeholder-val="{{false}}"><p class="in" style="margin:0;padding:0 20px 18px 82px;font-size:15px;color:#5E5E66;line-height:1.5">{{a.detail}}</p></sc-if>
</div>
</sc-for>
</section>

<aside style="flex:1 1 340px;min-width:0;display:flex;flex-direction:column;gap:28px">
<section data-in="1" aria-labelledby="notif-h" style="display:flex;flex-direction:column;gap:14px">
<div style="display:flex;justify-content:space-between;align-items:baseline"><h2 id="notif-h" style="margin:0;font-size:20px;font-weight:800;letter-spacing:-0.02em">Updates</h2><button onClick="{{toggleStack}}" aria-expanded="{{stackOpen}}" style="border:0;background:transparent;font-family:inherit;font-size:15px;font-weight:600;color:#2F5BEA;cursor:pointer;height:36px">{{stackLabel}}</button></div>
<div style="position:relative;height:{{stackH}}px;transition:height .55s cubic-bezier(.34,1.3,.5,1)">
<sc-for list="{{notes}}" as="n" hint-placeholder-count="3">
<div class="note" style="z-index:{{n.z}};transform:{{n.tf}};opacity:{{n.op}}"><span style="width:10px;height:10px;border-radius:50%;flex:none;background:{{n.color}}"></span><span style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;font-weight:600">{{n.t}}</span><span style="font-size:13px;color:#5E5E66">{{n.when}}</span></span></div>
</sc-for>
</div>
</section>

<section data-in="1" aria-labelledby="forms-h" style="border-radius:24px;background:#F6F5F2;padding:24px;display:flex;flex-direction:column;gap:14px">
<div style="display:flex;justify-content:space-between;align-items:baseline"><h2 id="forms-h" style="margin:0;font-size:20px;font-weight:800;letter-spacing:-0.02em">School forms</h2><span style="font-size:15px;font-weight:600;color:#5E5E66">4 of 6</span></div>
<div style="height:6px;border-radius:3px;background:#E4E2DD;overflow:hidden"><span data-fill="1" style="display:block;width:66%;height:100%;background:#2F5BEA;border-radius:3px;transform-origin:left"></span></div>
<span style="font-size:15px;color:#5E5E66">Left: medical certificate, orientation.</span>
<a href="Student-Ready.dc.html" class="btn" style="align-self:flex-start;height:42px">Finish</a>
</section>
</aside>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.root = null;
    this.state = { open: 'kalye', stack: false };
    this.apps = [
      { key: 'kalye', role: 'Data intern', co: 'Kalye Logistics', bg: '#FFF4E0', status: 'Interview Thu', color: '#2F5BEA', detail: 'Sent Mar 2. Viewed Mar 3. Interview set for Thursday, 2 PM.' },
      { key: 'mabuhay', role: 'Inventory systems intern', co: 'Mabuhay Foods', bg: '#E9F6EE', status: 'Viewed', color: '#16161A', detail: 'They opened your resume yesterday. Most reply within 3 days.' },
      { key: 'banaba', role: 'IT support intern', co: 'Banaba Bank', bg: '#F3EEFE', status: 'Waiting', color: '#5E5E66', detail: 'No reply in 5 days, so we sent them a reminder.' },
      { key: 'tanglaw', role: 'QA intern', co: 'Tanglaw Software', bg: '#EEF2FE', status: 'Filled', color: '#8A8890', detail: 'They hired someone else. 3 similar roles are open.' }
    ];
    this.notes = [
      { t: 'Kalye Logistics wants to interview you', when: '2 hours ago', color: '#2F5BEA' },
      { t: 'Your mom signed the consent form', when: 'Yesterday', color: '#1A7F45' },
      { t: '2 new jobs near Calamba', when: 'Yesterday', color: '#FFB020' }
    ];
  }
  componentDidMount() {
    const M = window.Motion, r = this.root;
    if (!M || !r || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
    const { animate, stagger, press } = M;
    const ease = [0.22, 1, 0.36, 1];
    animate(r.querySelectorAll('[data-in]'), { opacity: [0, 1], y: [22, 0] }, { delay: stagger(0.08), duration: 0.8, ease });
    animate(r.querySelectorAll('.app'), { opacity: [0, 1], x: [-10, 0] }, { delay: stagger(0.06, { startDelay: 0.35 }), duration: 0.5, ease });
    animate(r.querySelectorAll('[data-fill]'), { scaleX: [0, 1] }, { delay: 0.6, duration: 1, ease });
    const sun = r.querySelector('.spin');
    if (sun) animate(sun, { rotate: [0, 360] }, { duration: 40, repeat: Infinity, ease: 'linear' });
    r.querySelectorAll('[data-press]').forEach((el) => press(el, () => {
      animate(el, { scale: 0.95 }, { type: 'spring', stiffness: 700, damping: 30 });
      return () => animate(el, { scale: 1 }, { type: 'spring', stiffness: 500, damping: 15 });
    }));
  }
  renderVals() {
    const s = this.state;
    return {
      rootRef: (el) => { this.root = el; },
      apps: this.apps.map((a) => ({ ...a, open: s.open === a.key, isKalye: a.key === 'kalye', isMabuhay: a.key === 'mabuhay', isBanaba: a.key === 'banaba', isTanglaw: a.key === 'tanglaw',
        toggle: () => this.setState({ open: s.open === a.key ? '' : a.key }) })),
      notes: this.notes.map((n, i) => ({ ...n, z: 10 - i,
        tf: s.stack ? 'translateY(' + (i * 82) + 'px)' : 'translateY(' + (i * 12) + 'px) scale(' + (1 - i * 0.05) + ')',
        op: s.stack ? 1 : (i === 0 ? 1 : 0.75 - i * 0.2) })),
      stackOpen: s.stack, stackH: s.stack ? 82 * this.notes.length : 100,
      stackLabel: s.stack ? 'Show less' : 'Show all',
      toggleStack: () => this.setState({ stack: !s.stack })
    };
  }
}
</script>
</body>
</html>
